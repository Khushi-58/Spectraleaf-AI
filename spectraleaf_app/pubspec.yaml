name: spectraleaf_app
description: SpectraLeaf AI — Smart Crop Nutrient Deficiency Scanner

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # TFLite inference
  tflite_flutter: ^0.12.1

  # Camera & image picker
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  image: ^4.1.7

  # UI & animations
  google_fonts: ^6.2.1
  fl_chart: ^0.66.2
  lottie: ^3.1.0
  percent_indicator: ^4.2.3

  # File I/O
  path_provider: ^2.1.2
  path: ^1.9.0

  # PDF report generation
  pdf: ^3.10.8
  printing: ^5.12.0

  # Shared preferences (scan history)
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/models/model_m2_float16.tflite
    - assets/models/model_multitask_float16.tflite
    - assets/models/model_m2_int8.tflite
    - assets/models/model_multitask_int8.tflite

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/images/logo.png"
